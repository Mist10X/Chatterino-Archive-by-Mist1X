name: Build Windows release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: python -m pip install -r source/requirements-build.txt
      - name: Check release version
        shell: python
        run: |
          import os, runpy
          version = runpy.run_path('source/branding.py')['VERSION']
          if os.environ['GITHUB_REF_TYPE'] == 'tag':
              assert os.environ['GITHUB_REF_NAME'] == 'v' + version, 'Tag must match branding.py'
      - name: Test
        working-directory: source
        run: python -m unittest discover -p 'test_*.py'
      - name: Build
        run: python -m PyInstaller --noconfirm --clean --distpath dist --workpath build source/ChatterinoArchive-by-Mist1X.spec
      - name: Package and verify
        run: python tools/build_release.py
      - name: Create draft release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$env:RELEASE_TAG" releases/ChatterinoArchive-Windows-x64.zip releases/SHA256SUMS.txt --verify-tag --draft --title "$env:RELEASE_TAG" --notes-file RELEASE-NOTES.md
